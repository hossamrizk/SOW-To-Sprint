# Working calendar for the back-scheduler (stage 4).
#
# Egyptian delivery calendar:
#   - Weekend: Friday + Saturday (not Sat+Sun — this is the point of a local calendar).
#   - Public holidays: full list for 2026.
#
# The scheduler counts working days only, skipping anything listed here. The
# `date` field on every WorkItem lands on a real working day. If the go-live
# date itself falls on a weekend/holiday, the scheduler will refuse to schedule
# on that date and fail loudly — that's a real error, not something to paper over.
#
# Note on Islamic-calendar holidays: dates below use the widely-published 2026
# Egypt observed dates. In production these come from an authoritative service
# (they can shift ±1 day at short notice on moon-sighting).

weekend:
  - Friday
  - Saturday

public_holidays_2026:
  - { date: "2026-01-07", name: "Coptic Christmas" }
  - { date: "2026-01-25", name: "Revolution Day (Jan 25)" }
  - { date: "2026-03-20", name: "Eid al-Fitr (day 1)" }
  - { date: "2026-03-21", name: "Eid al-Fitr (day 2)" }
  - { date: "2026-03-22", name: "Eid al-Fitr (day 3)" }
  - { date: "2026-04-13", name: "Sham El-Nessim" }
  - { date: "2026-04-25", name: "Sinai Liberation Day" }
  - { date: "2026-05-01", name: "Labor Day" }
  - { date: "2026-05-27", name: "Eid al-Adha (day 1)" }
  - { date: "2026-05-28", name: "Eid al-Adha (day 2)" }
  - { date: "2026-05-29", name: "Eid al-Adha (day 3)" }
  - { date: "2026-06-16", name: "Islamic New Year" }
  - { date: "2026-07-23", name: "Revolution Day (Jul 23)" }
  - { date: "2026-08-25", name: "Prophet's Birthday" }
  - { date: "2026-10-06", name: "Armed Forces Day" }
