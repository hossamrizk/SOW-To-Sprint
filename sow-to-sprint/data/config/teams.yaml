# Teams — squads and named people the scheduler uses for assignment.
#
# `assignment_rule: round_robin_by_role` (master plan §8):
#   - Each WorkItem carries a `role` (looked up from estimation_library archetype).
#   - Assign the next available person with that role, round-robin.
#   - Squad ownership by module is respected first: a technical WorkItem whose
#     scope item is in module "Points Engine" is assigned within the squad that
#     lists "Points Engine" under its `modules`.
#
# Names are fictional (demo dataset). In production this comes from the org
# directory or HR system.

squads:
  - name: "Squad A — Loyalty Core"
    modules: ["Points Engine", "Redemption Catalog"]
    members:
      - { name: "Ahmed Hassan",  role: "Tech Lead" }
      - { name: "Mona Farid",    role: "Backend Engineer" }
      - { name: "Youssef Adel",  role: "Backend Engineer" }
      - { name: "Nour Sameh",    role: "QA Engineer" }

